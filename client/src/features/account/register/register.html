<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">SignUp</div>
  <div class="card-body">
    <form class="flex flex-col gap-4 w-full" #registerForm="ngForm" (ngSubmit)="register()">
      <input
        type="email"
        class="input input-bordered w-full"
        placeholder="Email"
        [(ngModel)]="credentials.email"
        name="email"
      />
      <input
        type="text"
        class="input input-bordered w-full"
        placeholder="Display Name"
        [(ngModel)]="credentials.displayName"
        name="displayName"
      />
      <input
        type="password"
        class="input input-bordered w-full"
        placeholder="Password"
        [(ngModel)]="credentials.password"
        name="password"
      />
      <!-- <select class="select w-full">
        <option disabled selected>Select a member</option>
        @for (member of members(); track $index) {
          <option [value]="member.id">{{ member.displayName }}</option>
        }
      </select> -->
      <div class="flex items-center gap-3 justify-end">
        <button class="btn" type="button" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" type="submit">Register</button>
      </div>
    </form>
  </div>
</div>
